name: Publish ac-homepage

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-ac-homepage.yml
      - publish-source.json
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: homepage-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.source.outputs.changed }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Checkout the ac-homepage source
        uses: actions/checkout@v6
        with:
          repository: junle-chen/ac-homepage
          ref: main
          path: source
          persist-credentials: false
      - name: Check whether committed source needs publishing
        id: source
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const revision = execFileSync('git', ['-C', 'source', 'rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          let changed = true;
          (async () => {
            try {
              const response = await fetch('https://junle-chen.github.io/deployment-source.json?ts=' + Date.now(), {cache: 'no-store', signal: AbortSignal.timeout(15000)});
              if (response.ok) {
                const deployed = await response.json();
                changed = deployed.sourceRepository !== 'junle-chen/ac-homepage' || deployed.sourceRevision !== revision;
              }
            } catch (_) {}
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'revision=' + revision + '\nchanged=' + changed + '\n');
            console.log(changed ? 'New ac-homepage source: ' + revision : 'The current source is already deployed.');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Set up Node.js
        if: steps.source.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install and build the committed website
        if: steps.source.outputs.changed == 'true'
        working-directory: source
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Validate the root domain and record the source revision
        if: steps.source.outputs.changed == 'true'
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const pkg = JSON.parse(fs.readFileSync('source/package.json', 'utf8'));
          assert.equal(pkg.homepage, 'https://junle-chen.github.io');
          assert.equal(fs.existsSync('source/CNAME'), false, 'The root GitHub site must not bind a custom domain.');
          assert.equal(fs.existsSync('source/dist/CNAME'), false, 'A stale custom domain would redirect the root site.');
          assert.ok(fs.existsSync('source/dist/index.html'));
          const manifest = {sourceRepository: 'junle-chen/ac-homepage', sourceRevision: process.env.SOURCE_REVISION};
          fs.writeFileSync('source/dist/deployment-source.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Upload the website artifact
        if: steps.source.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/dist

  deploy:
    if: needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the ac-homepage artifact
        id: deployment
        uses: actions/deploy-pages@v4
