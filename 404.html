<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=https://junle.site/">
    <link rel="canonical" href="https://junle.site/">
    <title>Redirecting...</title>
    <script>
      var target = new URL(
        window.location.pathname + window.location.search + window.location.hash,
        "https://junle.site"
      );
      window.location.replace(target.toString());
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="https://junle.site/">junle.site</a>.</p>
  </body>
</html>
